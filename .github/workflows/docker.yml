name: Docker

on:
  pull_request:
    paths:
      [
        Dockerfile,
        docker-compose.yml,
        .dockerignore,
        next.config.ts,
        package*.json,
        .github/workflows/docker.yml,
      ]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t lamplight:test .
      # Boots the image the way a self-hoster would and waits for the health check.
      - name: Smoke test
        run: |
          docker run -d --name lamplight -p 3000:3000 -e APP_PASSWORD=ci-password lamplight:test
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs lamplight
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
          tags="-t $image:latest -t $image:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags -t $image:${GITHUB_REF_NAME#v}"; fi
          docker build $tags .
          docker push --all-tags $image
